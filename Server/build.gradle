
plugins {
	id 'java'
	id 'application'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

application {
	mainClass = 'gamesuite.server.ServerApp'
}

dependencies {
    implementation project(':Core')
	implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-autoconfigure'
	implementation 'org.springframework.boot:spring-boot-starter-logging'
	implementation 'org.springframework.boot:spring-boot-starter-websocket:3.5.3'
	testImplementation 'org.mockito:mockito-core:5.18.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootRun {
	if (project.hasProperty('args')) {
		args project.args.split(',')
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('runTest', JavaExec) {
	group = 'test'
	description = 'runs a MockClient for server testing'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'gamesuite.server.TestApp'
	args = [
	        project.findProperty('host'),
			project.findProperty('port'),
			7
	]
	standardInput = System.in
}
