subprojects {

    apply plugin: 'java'

    repositories {
        // Use Maven Central for resolving dependencies.
        mavenCentral()
    }

    // Apply a specific Java toolchain to ease working on different environments.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    test {
        useJUnitPlatform()
    }
}

// Root build.gradle

def expoWebDist = file("$rootDir/Mobile/GameSuite-Mobile/dist")
def serverResources = file("$rootDir/Server/src/main/resources/static")

tasks.register('exportExpoWeb', Exec) {
    group = 'build'
    description = 'Exports the Expo web app to dist folder'
    workingDir "$rootDir/Mobile/GameSuite-Mobile"
    commandLine 'npx.cmd', 'expo', 'export', '--platform', 'web'
}

tasks.register('copyExpoToServer', Copy) {
    group = 'build'
    description = 'Copies Expo web output to server resources'
    dependsOn 'exportExpoWeb'
    from expoWebDist
    into serverResources
}

tasks.register('preparePluginsDir') {
    group = 'build'
    description = 'Creates the plugins folder if missing'
    doLast {
        def pluginsDir = file("$rootDir/plugins")
        if (!pluginsDir.exists()) {
            pluginsDir.mkdirs()
            println "Created plugins folder"
        }
    }
}

tasks.register('buildPlugins') {
    group = 'build'
    description = 'Builds Core, Server, Client jars and puts them in plugins folder'
    dependsOn ':Client:fatJar', ':Checkers:CheckersJar', ':Checkers:UIJar' // adjust task names if needed
    dependsOn 'preparePluginsDir'

    doLast {
        def pluginsDir = file("$rootDir/plugins")
        def jarFiles = [
            file("$rootDir/Checkers/build/libs/Checkers.jar"),
            file("$rootDir/Checkers/build/libs/CheckersUI.jar"),
        ]
        jarFiles.each { jar ->
            if (jar.exists()) {
                copy {
                    from jar
                    into pluginsDir
                }
                println "Copied ${jar.name} to plugins"
            } else {
                println "Jar not found: ${jar}"
            }
        }
    }
}

tasks.register('cleanExpo', Delete) {
    group = 'build'
    description = 'Runs Expo clean'
    delete "$rootDir/Mobile/GameSuite-Mobile/dist"
}


tasks.register('masterBuild') {
    group = 'build'
    description = 'Exports web, copies resources, builds jars and plugins'
    dependsOn 'copyExpoToServer', 'buildPlugins'
}

tasks.register('masterClean') {
    group = 'build'
    description = 'Cleans all subprojects, plugins folder, and Expo project'

    // Run the clean task of all subprojects first
    dependsOn subprojects.collect { it.tasks.named('clean') }
    // Clean Expo project
    dependsOn 'cleanExpo'

    doLast {
        // Delete plugins folder
        def pluginsDir = file("$rootDir/plugins")
        if (pluginsDir.exists()) {
            pluginsDir.deleteDir()
            println "Deleted plugins folder"
        }

         // Static resources directory
        def staticDir = file("$rootDir/Server/src/main/resources/static")

        // Items to delete
        def targets = [
                "_expo",
                "assets",
                "index.html",
                "metadata.json"
        ]

        targets.each { name ->
            def target = new File(staticDir, name)
            if (target.exists()) {
                target.deleteDir() ?: target.delete()
                println "Deleted ${target}"
            }
        }
    }

}

